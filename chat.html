<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard — Rizqi</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23101E33'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='serif' font-size='18' font-weight='700' fill='%23F6CB7A'%3ER%3C/text%3E%3C/svg%3E">
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --cream:#FFFDF7;--sage:#7FAE6A;--rose:#E8604C;
  --gold:#F2B441;--gold-lt:#F6CB7A;--moon:#5FAEDB;
  --line:rgba(242,180,65,.18);--panel-bg:rgba(9,18,32,.55);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Cormorant Garamond',serif;
  background:radial-gradient(ellipse at 20% 10%,rgba(127,174,106,.12) 0%,transparent 55%),
              radial-gradient(ellipse at 80% 90%,rgba(232,96,76,.10) 0%,transparent 55%),
              linear-gradient(160deg,#0A1830 0%,#123152 55%,#1C4A73 100%);
  color:var(--cream);
  min-height:100vh;
  display:flex;flex-direction:column;
}

/* ===== Top bar ===== */
#topbar{padding:16px 18px;border-bottom:1px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;gap:12px;}
#topbar .ttl{min-width:0;}
#topbar h1{font-weight:500;font-size:1.1rem;color:var(--cream);}
#topbar .sub{font-size:.7rem;color:rgba(255,253,247,.45);font-style:italic;margin-top:1px;}
#status-pill{display:flex;align-items:center;gap:6px;background:rgba(9,18,32,.6);
  border:1px solid var(--line);border-radius:20px;padding:6px 12px;flex-shrink:0;}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,253,247,.25);flex-shrink:0;}
.dot.on{background:var(--sage);box-shadow:0 0 6px rgba(127,174,106,.8);}
#status-pill span{font-family:'Space Mono',monospace;font-size:.6rem;color:rgba(255,253,247,.65);
  white-space:nowrap;}

/* ===== Content ===== */
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.panel{display:none;flex-direction:column;min-height:100%;}
.panel.active{display:flex;}

/* ===== Overview ===== */
#panel-overview{padding:18px 16px 24px;gap:10px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px;}
.stat-card{background:var(--panel-bg);border:1px solid var(--line);border-radius:16px;
  padding:14px 16px;display:flex;flex-direction:column;gap:4px;}
.stat-card .s-lbl{font-family:'Space Mono',monospace;font-size:.55rem;letter-spacing:1px;color:var(--gold);}
.stat-card .s-num{font-size:1.7rem;font-weight:500;color:var(--cream);line-height:1.1;}
.stat-card .s-sub{font-size:.72rem;color:rgba(255,253,247,.45);font-style:italic;}
.progress-track{margin-top:4px;height:6px;border-radius:6px;background:rgba(255,253,247,.1);overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--sage),var(--gold));border-radius:6px;transition:width .5s ease;}

.ov-section-lbl{font-family:'Space Mono',monospace;font-size:.58rem;letter-spacing:2px;
  color:rgba(255,253,247,.4);margin:4px 0 10px;}
.preview-list{display:flex;flex-direction:column;gap:8px;}
.preview-row{background:var(--panel-bg);border:1px solid var(--line);border-radius:14px;padding:11px 14px;}
.preview-row .p-date{font-family:'Space Mono',monospace;font-size:.5rem;letter-spacing:1px;color:rgba(255,253,247,.4);}
.preview-row .p-text{font-size:.85rem;color:var(--cream);margin-top:3px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.empty{margin:auto;text-align:center;font-style:italic;font-size:.85rem;color:rgba(255,253,247,.4);padding:20px;}

/* ===== Chat ===== */
#chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:9px;}
.bubble{max-width:82%;padding:9px 13px;border-radius:15px;font-size:.92rem;line-height:1.5;
  word-wrap:break-word;white-space:pre-wrap;}
.bubble .meta{display:block;font-family:'Space Mono',monospace;font-size:.52rem;letter-spacing:1px;
  color:rgba(255,253,247,.4);margin-top:4px;}
.bubble.naffa{align-self:flex-start;background:rgba(127,174,106,.16);border:1px solid rgba(127,174,106,.28);}
.bubble.rizqi{align-self:flex-end;background:rgba(242,180,65,.18);border:1px solid rgba(242,180,65,.3);}
#bar{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;flex-shrink:0;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));}
#msg{flex:1;background:rgba(9,18,32,.55);border:1px solid rgba(242,180,65,.28);border-radius:14px;
  padding:10px 13px;color:var(--cream);font-family:'Cormorant Garamond',serif;font-size:.95rem;
  resize:none;outline:none;max-height:100px;}
#msg:focus{border-color:rgba(242,180,65,.6);}
#send{background:rgba(242,180,65,.22);border:1px solid rgba(242,180,65,.5);color:var(--gold-lt);
  border-radius:14px;padding:0 18px;font-family:'Space Mono',monospace;font-size:.68rem;
  letter-spacing:1px;flex-shrink:0;}
#send:disabled{opacity:.5;}

/* ===== Entry list (Ruang Hujan / Surat 2030) ===== */
.entry-list{flex:1;overflow-y:auto;padding:16px 16px 12px;display:flex;flex-direction:column;gap:10px;}
.entry-card{background:rgba(9,18,32,.5);border:1px solid rgba(242,180,65,.22);border-radius:15px;
  padding:14px 16px;}
.entry-card .e-date{font-family:'Space Mono',monospace;font-size:.52rem;letter-spacing:1px;
  color:rgba(255,253,247,.4);margin-bottom:7px;}
.entry-card .e-text{font-size:.88rem;line-height:1.6;color:var(--cream);white-space:pre-wrap;}
.entry-card .e-label{font-family:'Space Mono',monospace;font-size:.52rem;letter-spacing:2px;
  color:var(--gold);margin:9px 0 3px;text-transform:uppercase;}
.entry-card .e-label:first-of-type{margin-top:0;}
.panel-toolbar{padding:10px 16px;display:flex;border-top:1px solid var(--line);flex-shrink:0;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));}
.save-btn{background:rgba(127,174,106,.16);border:1px solid rgba(127,174,106,.4);color:var(--sage);
  border-radius:30px;padding:9px 18px;font-family:'Space Mono',monospace;font-size:.62rem;
  letter-spacing:1px;width:100%;}
.save-btn:disabled{opacity:.4;}

/* ===== Live panel ===== */
#panel-live{align-items:center;justify-content:center;padding:24px;}
#live-status{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;}
#live-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,253,247,.25);}
#live-online-lbl{font-family:'Space Mono',monospace;font-size:.68rem;letter-spacing:2px;
  color:rgba(255,253,247,.6);text-transform:uppercase;}
#live-stage-lbl{font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--gold-lt);}
#live-sub-lbl{font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:1px;
  color:rgba(255,253,247,.4);}

/* ===== Bottom tab bar (navigasi utama, dioptimalkan untuk HP) ===== */
#tabbar{flex-shrink:0;display:flex;border-top:1px solid var(--line);
  background:rgba(6,13,24,.55);backdrop-filter:blur(6px);
  padding-bottom:env(safe-area-inset-bottom);}
.tab-btn{all:unset;box-sizing:border-box;flex:1;display:flex;flex-direction:column;
  align-items:center;gap:3px;padding:9px 4px 8px;color:rgba(255,253,247,.5);cursor:pointer;}
.tab-btn .tab-ic{font-size:1.15rem;line-height:1;}
.tab-btn .tab-lbl{font-family:'Space Mono',monospace;font-size:.52rem;letter-spacing:.5px;}
.tab-btn.active{color:var(--gold-lt);}

/* Di layar lebar (tablet/desktop), batasi lebar konten biar tidak melebar aneh */
@media (min-width:640px){
  #topbar,#panel-overview,#chat-body,#bar,.entry-list,.panel-toolbar{
    max-width:640px;margin-left:auto;margin-right:auto;width:100%;
  }
  #tabbar{max-width:640px;margin:0 auto;width:100%;}
}
</style>
</head>
<body>

<div id="content">

        <div class="s-lbl">SURAT KE 2030</div>

<!-- ===== Bottom tab bar ===== -->
<div id="tabbar">
  <button class="tab-btn active" data-tab="overview"><span class="tab-ic">▤</span><span class="tab-lbl">Overview</span></button>
  <button class="tab-btn" data-tab="chat"><span class="tab-ic">💬</span><span class="tab-lbl">Chat</span></button>
  <button class="tab-btn" data-tab="rain"><span class="tab-ic">🌧️</span><span class="tab-lbl">Hujan</span></button>

<script>
const firebaseConfig = {
  apiKey:"AIzaSyBHeicloB3jNsx0iiHyhaAZGkrEV0p2GZ8",
  authDomain:"adalahpokoknya-6cabf.firebaseapp.com",
  projectId:"adalahpokoknya-6cabf",
  storageBucket:"adalahpokoknya-6cabf.firebasestorage.app",
  messagingSenderId:"40678745638",
  appId:"1:40678745638:web:8a5c0b3d4711e548c4e8e7"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ---------- Tab switching ----------
const titles={
  overview:['Overview','ringkasan aktivitas Naffa di Taman Bulan'],
  chat:['Balas Naffa','tersambung langsung ke Taman Bulan'],
  rain:['Ruang Hujan','apa yang pernah Naffa lepaskan'],
  letter:['Surat ke 2030','syukur, tujuan, dan pesan dari Naffa'],
  live:['Live','lihat stage yang sedang dibuka Naffa, real-time']
};
function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  const t=titles[tab];
  document.getElementById('page-title').textContent=t[0];
  document.getElementById('page-sub').textContent=t[1];
}
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> switchTab(btn.dataset.tab));
});
document.querySelectorAll('[data-jump]').forEach(card=>{
  card.addEventListener('click', ()=> switchTab(card.dataset.jump));
});

// ---------- Helper: format tanggal ----------
function fmtDate(iso){
  const d=new Date(iso);
  if(isNaN(d)) return '';
  return d.toLocaleString('id-ID',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function fmtShort(iso){
  const d=new Date(iso);
  if(isNaN(d)) return '';
  return d.toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
}
function downloadText(filename, content){
  const blob=new Blob([content], {type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// ---------- Chat ----------
let chatStarted=false;
let chatEntries=[];
function startChat(){
  if(chatStarted) return;
  chatStarted=true;
  const body=document.getElementById('chat-body');
  db.collection('live_chat').orderBy('ts','asc').onSnapshot(function(snap){
    if(snap.empty){
      body.innerHTML='<div class="empty">Belum ada pesan. Tulis sesuatu untuk memulai ✦</div>';
      chatEntries=[];
      updateOverviewChat();
      return;
    }
    body.innerHTML='';
    chatEntries=[];
    snap.forEach(function(doc){
      const m=doc.data();
      chatEntries.push(m);
      const isRizqi=(m.sender==='rizqi');
      const row=document.createElement('div');
      row.className='bubble '+(isRizqi?'rizqi':'naffa');
      const textNode=document.createElement('span');
      textNode.textContent=m.text||'';
      row.appendChild(textNode);
      if(m.ts){
        const meta=document.createElement('span');
        meta.className='meta';
        const d=new Date(m.ts);
        if(!isNaN(d)) meta.textContent=d.toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
        row.appendChild(meta);
      }
      body.appendChild(row);
    });
    body.scrollTop=body.scrollHeight;
    updateOverviewChat();
  }, function(err){
    body.innerHTML='<div class="empty">Gagal memuat chat — periksa koneksi.</div>';
    console.error(err);
  });
}

async function sendMsg(){
  const msgInput=document.getElementById('msg');
  const sendBtn=document.getElementById('send');
  const text=msgInput.value.trim().substring(0,500);
  if(!text) return;
  sendBtn.disabled=true;
  try{
    await db.collection('live_chat').add({
      sender:'rizqi', text:text, ts:new Date().toISOString()
    });
    msgInput.value='';
    msgInput.style.height='auto';
  }catch(e){ console.error(e); }
  sendBtn.disabled=false;
  msgInput.focus();
}
document.getElementById('send').addEventListener('click', sendMsg);
document.getElementById('msg').addEventListener('keydown', function(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMsg(); }
});
document.getElementById('msg').addEventListener('input', function(){
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,100)+'px';
});

// ---------- Ruang Hujan ----------
let rainStarted=false;
let rainEntries=[];
function startRainList(){
  if(rainStarted) return;
  rainStarted=true;
  const list=document.getElementById('rain-list');
  db.collection('releases').orderBy('createdAt','desc').onSnapshot(function(snap){
    if(snap.empty){
      list.innerHTML='<div class="empty">Belum ada yang dilepaskan Naffa di sini ✦</div>';
      rainEntries=[];
      updateOverviewRain();
      return;
    }
    list.innerHTML='';
    rainEntries=[];
    snap.forEach(function(doc){
      const m=doc.data();
      rainEntries.push(m);
      const card=document.createElement('div');
      card.className='entry-card';
      const date=document.createElement('div');
      date.className='e-date';
      date.textContent=fmtDate(m.createdAt);
      const text=document.createElement('div');
      text.className='e-text';
      text.textContent=m.text||'';
      card.appendChild(date); card.appendChild(text);
      list.appendChild(card);
    });
    updateOverviewRain();
  }, function(err){
    list.innerHTML='<div class="empty">Gagal memuat Ruang Hujan — periksa koneksi.</div>';
    console.error(err);
  });
}
document.getElementById('rain-save').addEventListener('click', function(){
  if(!rainEntries.length) return;
  const content=rainEntries.map(m=>'['+fmtDate(m.createdAt)+']\n'+(m.text||'')).join('\n\n---\n\n');
  downloadText('ruang-hujan-naffa.txt', content);
});

// ---------- Surat ke 2030 ----------
let letterStarted=false;
let letterEntries=[];
function startLetterList(){
  if(letterStarted) return;
  letterStarted=true;
  const list=document.getElementById('letter-list');
  db.collection('future_letters').orderBy('writtenAt','desc').onSnapshot(function(snap){
    if(snap.empty){
      list.innerHTML='<div class="empty">Belum ada surat yang disegel Naffa ✦</div>';
      letterEntries=[];
      updateOverviewLetter();
      return;
    }
    list.innerHTML='';
    letterEntries=[];
    snap.forEach(function(doc){
      const m=doc.data();
      letterEntries.push(m);
      const card=document.createElement('div');
      card.className='entry-card';
      const date=document.createElement('div');
      date.className='e-date';
      date.textContent='Ditulis '+fmtDate(m.writtenAt)+' · dibuka '+(m.openAt||'2030-01-01');
      card.appendChild(date);
      [['Syukur',m.syukur],['Tujuan',m.tujuan],['Pesan',m.pesan]].forEach(function(pair){
        const lbl=document.createElement('div');
        lbl.className='e-label'; lbl.textContent=pair[0];
        const txt=document.createElement('div');
        txt.className='e-text'; txt.textContent=pair[1]||'';
        card.appendChild(lbl); card.appendChild(txt);
      });
      list.appendChild(card);
    });
    updateOverviewLetter();
  }, function(err){
    list.innerHTML='<div class="empty">Gagal memuat Surat ke 2030 — periksa koneksi.</div>';
    console.error(err);
  });
}
document.getElementById('letter-save').addEventListener('click', function(){
  if(!letterEntries.length) return;
  const content=letterEntries.map(function(m){
    return 'Ditulis '+fmtDate(m.writtenAt)+' · dibuka '+(m.openAt||'2030-01-01')
      +'\n\nSyukur: '+(m.syukur||'')
      +'\n\nTujuan: '+(m.tujuan||'')
      +'\n\nPesan: '+(m.pesan||'');
  }).join('\n\n===\n\n');
  downloadText('surat-2030-naffa.txt', content);
});

// ---------- Live ----------
const STAGE_LABELS={
  s1:'01 · Gerbang', s2:'02 · Sambutan', s2b:'03 · Kilas Balik', s3b2:'04 · Prolog',
  s3:'07 · Otentikasi Jiwa', s3b:'08 · Mahkota Takdir', sci:'09 · Animasi Filosofis',
  spz:'10 · Puzzle Bunga', 'svg-screen':'11 · Virtual Garden', srh:'12 · Ruang Hujan',
  s8:'13 · Surat Nostalgia', sfl:'14 · Surat ke 2030', s9:'15 · Tiga Restu',
  s9b:'16 · Taman Bunga', s10:'17 · Tiup Lilin', s11:'18 · Selamat Ulang Tahun!',
  sphoto:'19 · Bilik Foto', s13:'20 · Sertifikat'
};

let liveStarted=false;
function startLive(){
  if(liveStarted) return;
  liveStarted=true;
  const dot=document.getElementById('live-dot'), onlineLbl=document.getElementById('live-online-lbl'),
        stageLbl=document.getElementById('live-stage-lbl'), subLbl=document.getElementById('live-sub-lbl');
  const sideDot=document.getElementById('side-dot'), sideOnline=document.getElementById('side-online');

  db.collection('live_presence').doc('naffa').onSnapshot(function(doc){
    if(!doc.exists){
      onlineLbl.textContent='Belum ada data';
      stageLbl.textContent='';
      subLbl.textContent='Menunggu Naffa membuka Taman Bulan ✦';
      sideOnline.textContent='Belum ada data';
      updateOverviewLive(null);
      return;
    }
    const d=doc.data();
    const label=STAGE_LABELS[d.stageId]||d.stageId;
    const ageMs=Date.now()-new Date(d.ts).getTime();
    const online=ageMs<15000;
    const stageIdx=(d.stageIdx||0)+1, total=d.total||20;

    dot.style.background=online?'#7FAE6A':'rgba(255,253,247,.25)';
    dot.style.boxShadow=online?'0 0 8px rgba(127,174,106,.7)':'none';
    onlineLbl.textContent=online?'Online':'Terakhir aktif '+Math.round(ageMs/1000)+'d lalu';
    stageLbl.textContent='Stage '+stageIdx+'/'+total;
    subLbl.textContent=label;

    sideDot.classList.toggle('on', online);
    sideOnline.textContent=online?'Online':'Terakhir '+Math.round(ageMs/1000)+'d lalu';

    updateOverviewLive({online, stageIdx, total, label});
  }, function(err){
    onlineLbl.textContent='Gagal memuat status live.';
    sideOnline.textContent='Gagal memuat.';
    console.error(err);
  });
}

// ---------- Overview ----------
function updateOverviewChat(){
  document.getElementById('ov-chat-count').textContent=chatEntries.length;
  const last=chatEntries[chatEntries.length-1];
  document.getElementById('ov-chat-sub').textContent=last
    ? (last.sender==='rizqi'?'Terakhir dari Rizqi':'Terakhir dari Naffa')+' · '+fmtShort(last.ts)
    : 'belum ada pesan';

  const recent=document.getElementById('ov-recent-chat');
  if(!chatEntries.length){
    recent.innerHTML='<div class="empty" style="padding:14px 0;">Belum ada pesan.</div>';
    return;
  }
  recent.innerHTML='';
  chatEntries.slice(-5).reverse().forEach(function(m){
    const row=document.createElement('div');
    row.className='preview-row';
    row.addEventListener('click', ()=> switchTab('chat'));
    const date=document.createElement('div');
    date.className='p-date';
    date.textContent=(m.sender==='rizqi'?'Rizqi':'Naffa')+' · '+fmtShort(m.ts);
    const text=document.createElement('div');
    text.className='p-text';
    text.textContent=m.text||'';
    row.appendChild(date); row.appendChild(text);
    recent.appendChild(row);
  });
}
function updateOverviewRain(){
  document.getElementById('ov-rain-count').textContent=rainEntries.length;
  document.getElementById('ov-rain-sub').textContent=rainEntries.length
    ? 'terakhir '+fmtShort(rainEntries[0].createdAt)
    : 'belum ada entri';
}
function updateOverviewLetter(){
  document.getElementById('ov-letter-count').textContent=letterEntries.length;
  document.getElementById('ov-letter-sub').textContent=letterEntries.length
    ? 'terakhir '+fmtShort(letterEntries[0].writtenAt)
    : 'belum ada surat';
}
function updateOverviewLive(d){
  const numEl=document.getElementById('ov-live-stage');
  const subEl=document.getElementById('ov-live-sub');
  const fillEl=document.getElementById('ov-progress-fill');
  if(!d){
    numEl.textContent='–';
    subEl.textContent='belum ada data';
    fillEl.style.width='0%';
    return;
  }
  numEl.textContent=d.stageIdx+'/'+d.total;
  subEl.textContent=(d.online?'● Online sekarang':'terakhir dilihat')+' · '+d.label;
  fillEl.style.width=Math.round((d.stageIdx/d.total)*100)+'%';
}

// ---------- Mulai semua listener, setelah semua fungsi & variabel siap ----------
startChat();
startRainList();
startLetterList();
startLive();
</script>
